mode: rule
port: 7890
socks-port: 7891
allow-lan: false
log-level: warning
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.vpn.example.com"
    - "vpn.example.com"
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "stun.*.*"
    - "+.stun.*.*"
    - "time.*.com"
    - "+.market.xiaomi.com"
    - "+.push.apple.com"
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

{{ conf | except("proxy-groups", "port", "mode") | yaml }}

proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ♻️ 自动选择
  - DIRECT
  {{ proxy_remarks | yaml | indent(2) }}

- name: ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
  {{ proxy_remarks | yaml | indent(2) }}

- name: 🌏 国内直连
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择

- name: 🐟 漏网之鱼
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT

{{ conf.get("proxy-groups", []) | yaml }}

