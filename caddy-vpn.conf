# caddy-vpn.conf
# Drop this block into your Caddyfile (or include it).
# Replace every occurrence of:
#   vpn.example.com       -> your actual VPN domain
#   REPLACE_ME_ADMIN_PASS -> a strong random token (same value goes in .env CADDY_ADMIN_PASS_TOKEN)

vpn.example.com {
    encode gzip zstd

    # /admin friendly alias -> Marzban dashboard
    redir /admin /dashboard/ 302
    redir /admin/ /dashboard/ 302

    # Admin gate — protects /setup* + /dashboard* + /dashboard-login*
    # Entry: ?pass=REPLACE_ME_ADMIN_PASS  ->  sets cookie  ->  302 redirect (strips query)
    # Three ways through: ?pass / cookie / Referer from homepage
    @admin_path path /setup /setup.html /setup/* /dashboard /dashboard/* /dashboard-login.html /dashboard-login
    handle @admin_path {
        @adm_with_pass query pass=REPLACE_ME_ADMIN_PASS
        handle @adm_with_pass {
            header Set-Cookie "vpn_admin_pass=REPLACE_ME_ADMIN_PASS; Path=/; Max-Age=86400; Secure; SameSite=Lax"
            redir https://vpn.example.com{path} 302
        }
        @adm_has_cookie header_regexp Cookie vpn_admin_pass=REPLACE_ME_ADMIN_PASS
        handle @adm_has_cookie {
            @to_dashboard path /dashboard /dashboard/*
            handle @to_dashboard {
                reverse_proxy 127.0.0.1:8000
            }
            handle {
                reverse_proxy 127.0.0.1:3100
            }
        }
        @adm_from_homepage header_regexp Referer ^https://your-homepage-domain\.example\.com
        handle @adm_from_homepage {
            header Set-Cookie "vpn_admin_pass=REPLACE_ME_ADMIN_PASS; Path=/; Max-Age=86400; Secure; SameSite=Lax"
            @to_dashboard2 path /dashboard /dashboard/*
            handle @to_dashboard2 {
                reverse_proxy 127.0.0.1:8000
            }
            handle {
                reverse_proxy 127.0.0.1:3100
            }
        }
        handle {
            redir https://vpn.example.com/ 302
        }
    }

    # Marzban subscription API (user subscription links)
    handle /sub/* {
        reverse_proxy 127.0.0.1:8000
    }

    # Signup service endpoints
    handle /api/signup* {
        reverse_proxy 127.0.0.1:3200
    }
    handle /api/me/* {
        reverse_proxy 127.0.0.1:3200
    }
    handle /api/account/* {
        reverse_proxy 127.0.0.1:3200 {
            lb_try_duration 8s
            lb_try_interval 250ms
            transport http {
                dial_timeout 2s
            }
        }
    }

    # Marzban admin token endpoint (dashboard login)
    handle /api/admin/token {
        reverse_proxy 127.0.0.1:8000
    }
    handle /api/admin/admin {
        reverse_proxy 127.0.0.1:8000
    }
    # All other /api/admin/* -> signup-service (stats/invites/signups/config)
    handle /api/admin/* {
        reverse_proxy 127.0.0.1:3200 {
            lb_try_duration 8s
            lb_try_interval 250ms
            transport http {
                dial_timeout 2s
            }
        }
    }

    # Marzban dashboard + API + static assets
    handle /dashboard* {
        reverse_proxy 127.0.0.1:8000
    }
    handle /api/* {
        reverse_proxy 127.0.0.1:8000
    }
    handle /statics/* {
        reverse_proxy 127.0.0.1:8000
    }

    # Health check
    handle /healthz {
        respond "ok" 200
    }

    # Everything else -> Animal Island static portal
    handle {
        reverse_proxy 127.0.0.1:3100
    }

    log {
        output file /var/log/caddy/vpn.access.log {
            roll_size 50mb
            roll_keep 5
        }
    }
}
